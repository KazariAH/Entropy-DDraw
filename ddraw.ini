; QuantumDDraw settings (all keys optional)
[ddraw]
; marks this file as the Entropy-DDraw ini: the client regenerates a ddraw.ini without it from this template
; (a cnc-ddraw / other renderer ini), and the DLL ignores noactivateapp=false from an ini without it
client=Entropy-DDraw
; true  = when the game asks for exclusive fullscreen, show it in a window (resolution is NOT changed)
; false = really switch the display mode with ChangeDisplaySettings (restored on exit / Alt-Tab)
windowed=true
; initial client size multiplier for the emulated window, 0 = largest integer that fits the work area
windowscale=0
; how the image fills a resized window: stretch | aspect | integer
scale=aspect
; bilinear filtering for non-integer scaling (default nearest)
linear=false
; vertical sync via wglSwapIntervalEXT (skipped if the driver does not expose it)
vsync=false
; presentation cap, 0 = present whenever the game changed the screen
maxfps=0
; remap GetCursorPos/SetCursorPos/ClipCursor/... while fullscreen is emulated in a window
hookmouse=true
; DPI awareness declared at load (dynamic API lookup, Win7 safe): permonitor = per-monitor v2 (real pixels on
; every monitor, the window keeps its client size when it moves to a monitor with another scale);
; system = one DPI for all monitors; off = nothing declared (Windows stretches the window as a bitmap).
; Takes effect at the next start. The older dpiaware=false means off.
dpi=permonitor
; allow resizing / maximizing the emulated window
resizable=true
; write ddraw.log (counters, flushed every 5 seconds)
log=true
; true (default) = never tell the game it lost the focus while windowed / fullscreen-windowed: it keeps running in the
; background (like cnc-ddraw for RA2 / YR; QEC pauses otherwise, which stalls a multiplayer game); false = pass it on
noactivateapp=true
; (writewatch=false, the default) poll the visible primary every tick for changes made outside
; Lock/Blt (needed by QEC); false = dirty rects only
pollprimary=true
; true = the primary is write-watched memory: Windows lists the 4 KB pages the game wrote, only those
; rows are copied (no comparison of the whole picture), without the lock the game's calls take, and a frame is
; presented once the game has finished drawing it. Measured in QEC (Q149): our render thread -50% CPU, but the game
; thread +7% (+35 ms/s kernel time: Windows tracks the writes with page faults). false (default) = the Q148 way
writewatch=false
; presentquiet / presentcap apply only with presentsync=true or writewatch=true (ignored otherwise): present once
; the game's drawing has been quiet for presentquiet ms, but at most presentcap ms after its first write
presentquiet=2
presentcap=8
; writewatch=false: true = present a frame once the game's drawing calls to the primary (Blt / Unlock) have stopped for
; presentquiet ms (at most presentcap) - one present per drawn frame; false (default, Q163) = present on every wake-up.
; The coalescing can pace unevenly in games that draw in irregular bursts (QEC stuttered with it); when on, ddraw.log
; gets a "present intervals" percentile line every 10 s
presentsync=false
; true (default, Q165) = while the game copies whole frames onto the primary (QEC: one full-surface Blt per frame), upload
; and present once per such frame; writes in between are not uploaded (the next frame copy contains them)
framesync=true
; framesync: ms without a full-frame copy before every change is shown again as it comes (menus, dialogs, briefing);
; keep it above one frame of the game (30 fps = 33.3 ms), or partial writes race the next frame
framefallback=50
; experiment (Q164): render thread priority (SetThreadPriority) - 0 = normal (default), 1 = above normal like cnc-ddraw
renderpriority=0
; experiment (Q164): true (default) = also present on a wake-up by a drawing call that brought nothing new; false = skip
emptypresents=true
; stretch blits with a column table / memcpy runs (same pixels as the per-pixel formula, ~8x faster); false = Q149
faststretch=true
; copies of 1 MB+ between surfaces: memmove (default) or sse2nt (non-temporal stores; no gain measured offline)
blitcopy=memmove
; changed rows are read once from the primary, into the shadow copy and straight into the upload buffer (OpenGL with
; pixel buffer objects, 16 / 32 bpp); false = copy to the shadow, then shadow -> upload buffer (Q151)
fusedupload=true
; keep the render thread on the core cluster (shared L3 cache) of the game thread; no gain measured in QEC (Q153),
; whose process runs on processor 0 only
rendercluster=false
; debug: rotate "before" (Q149 defaults), the configured way and that with blitcopy=sse2nt every this many seconds
; (same-session comparison in ddraw.log), 0 = off
perfab=0
; debug: write ddraw_primary.bmp / ddraw_lastlock.bmp next to ddraw.log every 5 s
dump=false
; DDSCL_NORMAL games (QEC): treat the game window's client area as the screen - primary of the client
; size, client-relative coordinates, window can be dragged anywhere (false = old desktop-sized primary)
normalmode=true
; upload through OpenGL pixel buffer objects when the driver has them (false = synchronous glTexSubImage2D)
pbo=true
; debug: log GDI / dialog calls and blits to the primary made by the game modules
trace=false
; --- display modes / window (Q141) ---
; true = the windowed state keeps its caption and frame; false = borderless window (drag it by the top
; 6-pixel strip, resize at the other edges). Same meaning as cnc-ddraw's border key.
border=true
; true = start in borderless fullscreen (window covering the monitor, resolution unchanged)
fullscreen=false
; windowed=false switches the monitor to the game resolution; refresh rate for that mode, 0 = driver default
refresh_rate=0
; Alt + this virtual key code toggles window <-> fullscreen (borderless, or exclusive with windowed=false); 0 = off
keytogglefullscreen=0x0D
; Ctrl + this virtual key code releases / re-locks the cursor clip the game asked for; 0 = off
keyunlockcursor=0x09
; remember the window position / size and the fullscreen state in quantumddraw.state next to the DLL
savesettings=true
; --- mouse (Q141) ---
; mouse speed factor while the cursor is locked to the game, 0.1 - 10 (1.0 = unchanged)
adjmouse=1.0
; put the cursor in the middle of the game screen when it starts and after a fullscreen / window switch
center_cursor_fix=true
; --- focus / close / surfaces (Q142) ---
; mouse input of the game's child dialogs follows the picture when it is offset by black bars or scaled
; (fullscreen 2560x1440 on a 2560x1600 monitor: buttons are clicked where they are drawn)
letterboxoffset=true
; after Alt+Tab also reset the thread key state of Alt / Ctrl / Shift and send all missed key-ups
; (false: only the Alt key-up the game missed is sent)
fix_alt_key_stuck=false
; game thread busy: once a second our drawing calls dispatch one of its window messages (false: only peek
; at the input, which already keeps Windows from marking the window "Not Responding")
fix_not_responding=false
; true = the close button / Alt+F4 / WM_CLOSE is left entirely to the game; false = the game handles it
; first and the process is ended 3 s later if it is still there (not when the game shows a dialog)
game_handles_close=false
; clear the new back buffer after Flip, all surfaces after SetDisplayMode / Restore (no stale frames)
flipclear=false
; Game dialogs (QEC: briefing, Esc menu, save / load, loading screen are child windows over the picture).
; fixchilds=1: the dialogs are shown above our output (childpaint, keepclipchildren); 0 = off
fixchilds=1
; with fixchilds: after a present, the picture under each visible child window is painted into it, so the
; dialogs show exactly what the game drew whatever Windows puts above our output
childpaint=true
; debug: 0 = the game repaints its dialogs itself (default; anything else wipes QEC's briefing text),
; 1 = we also invalidate the dialogs, 2 = dialogs and their controls
childrepaint=0
; with fixchilds + childpaint: the game window keeps WS_CLIPCHILDREN (QEC clips the briefing text to its text box
; without it); false = remove it as before (only for tests)
keepclipchildren=true
; cursor kept inside the game picture (windowed; fullscreen always keeps it there): 1 = while a mouse button is
; held after a press in the picture, so a box selection cannot end outside the window (default); 2 = from the
; first click until focus loss / Ctrl+keyunlockcursor, like cnc-ddraw; 0 = off
lockcursor=1
; debug: log what the GetCursorPos hook reports to the game, and the game thread's keyboard messages
mouseprobe=false
; debug: present continuously (frame interval / vsync measurement)
vsynctest=false
; --- renderer / diagnostics / window (Q143) ---
; auto = OpenGL, falling back to GDI when no OpenGL context can be made (or only Microsoft's software GL
; "GDI Generic" is there); opengl = OpenGL only; gdi = StretchDIBits to the window, no OpenGL at all
renderer=auto
; crash report: on an unhandled exception (or when the game's own crash handler ends the process) write
; ddraw_crash_<time>.txt (code, module+offset, registers, call chain, last 32 events) and a minidump
; ddraw_crash_<time>.dmp next to the DLL; true = stacks, data segments, handles, referenced memory (~10 MB),
; full = the whole process memory (~500 MB for QEC), false = report only. The newest 5 are kept.
crashdump=true
; start the window in the middle of the monitor the game created it on (a saved position is overridden, the size kept)
center_window=false
; take the menu bar off the game window (its client area keeps the size)
remove_menu=false
; this virtual key code saves the picture (game resolution, no black bars) as Screenshots\<date_time>.png
; next to the DLL; 0 = off. Default F12.
keyscreenshot=0x7B
; debug: 2 s after the first frame the render thread raises an exception (true) / writes to address 0x10 (av)
; - tests the crash report and dump; the game is ended
crashtest=false
; debug: OpenGL context creation counts as failed (tests renderer=auto falling back to GDI)
forceglfail=false
; --- monitors / display modes / safety (Q144) ---
; Ctrl + this virtual key code moves the window / fullscreen to the next monitor (enumeration order, wraps;
; windowed: same place relative to the work area; a real mode switch moves along); 0 = off
keynextmonitor=0
; EnumDisplayModes reports the real modes of the game window's monitor (size + refresh rate, each in 8 / 16
; / 32 bpp). resolutions = only these sizes, e.g. 2560x1440,1920x1080 (empty = all);
; max_resolutions = WxH (no size above it) or N (only the N largest sizes); empty / 0 = no limit
resolutions=
max_resolutions=
; a sentinel row before and after every surface; Lock / Unlock / Release check it and log
; "guard_lines ALARM" when the game wrote past its surface (repaired after the report)
guard_lines=false
; the game's clocks (QueryPerformanceCounter, timeGetTime, GetTickCount[64]) advance at most this many ms
; between two reads of the game thread - no fast-forward after a stall; clamps are logged. 0 = unlimited
maxgameticks=0
; debug: a simulated monitor of this size right of the desktop (multi-monitor code path tests), e.g. 1920x1080
monitortest=
; debug (needs guard_lines=true): Unlock #300 / #600 / #900 write past a surface on purpose
guardtest=false
; debug: the game thread is held this many ms inside a drawing call, 20 / 40 / 60 s after the first one
stalltest=0
